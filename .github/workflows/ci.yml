name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compileall (python)
        run: python -m compileall -q desk service outdesk love service || true
      - name: ruff (python lint)
        run: |
          python -m pip install -q ruff || true
          ruff check . || true
      - name: luajit syntax (lua)
        run: |
          sudo apt-get install -y luajit >/dev/null 2>&1 || true
          find love -name '*.lua' -print0 | xargs -0 -I{} sh -c 'luajit -b "$1" /dev/null 2>&1 || echo "FAIL: $1"' _ {} || true
