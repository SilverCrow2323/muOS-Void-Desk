<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="t d"><title id="t">Firmware and controller profile resolution</title><desc id="d">Release, device and SDL controller identity are combined to select a tested profile or a safe fallback.</desc><rect width="1400" height="600" fill="#0a111a"/><g font-family="Arial,sans-serif" fill="#e8f1f6"><text x="55" y="58" fill="#47dae6" font-size="18" letter-spacing="4">03 / INPUT COMPATIBILITY</text><text x="55" y="120" font-size="40" font-weight="bold">Resolve release + device + controller</text><g stroke-width="3"><rect x="65" y="190" width="330" height="82" rx="14" fill="#182638" stroke="#f5b74b"/><rect x="65" y="310" width="330" height="82" rx="14" fill="#182638" stroke="#47dae6"/><rect x="65" y="430" width="330" height="82" rx="14" fill="#182638" stroke="#64dc9b"/></g><text x="100" y="240" font-size="24">FIRMWARE RELEASE</text><text x="100" y="360" font-size="24">DEVICE / BOARD</text><text x="100" y="480" font-size="24">SDL CONTROLLER GUID</text><path d="M395 230L520 320M395 350H520M395 470L520 390" fill="none" stroke="#47dae6" stroke-width="4"/><rect x="525" y="270" width="355" height="170" rx="18" fill="#102c38" stroke="#47dae6" stroke-width="4"/><text x="565" y="330" font-size="29" font-weight="bold">PROFILE RESOLVER</text><text x="565" y="375" font-size="20">Composite match + schema</text><text x="565" y="407" font-size="20">validation + test evidence</text><path d="M880 355H1000" stroke="#47dae6" stroke-width="4"/><rect x="1010" y="190" width="320" height="92" rx="15" fill="#102b25" stroke="#64dc9b" stroke-width="3"/><rect x="1010" y="310" width="320" height="92" rx="15" fill="#302719" stroke="#f5b74b" stroke-width="3"/><rect x="1010" y="430" width="320" height="92" rx="15" fill="#291820" stroke="#f64958" stroke-width="3"/><text x="1045" y="245" font-size="25">ANDROMEDA · TARGET</text><text x="1045" y="365" font-size="25">JACARANDA · LEGACY</text><text x="1045" y="485" font-size="25">SUPERNOVA · PREVIEW</text><text x="65" y="570" fill="#f5b74b" font-size="18">UNKNOWN BUILD → SAFE GENERIC PROFILE + CALIBRATION · NEVER GUESS A MAPPING</text></g></svg>